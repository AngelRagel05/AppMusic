[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundshelf"
version = "1.0.0"
description = "Local web application for comparing, editing and downloading music."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Angel J Ragel" }]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "yt-dlp>=2025.1.0",
    "mutagen>=1.47.0",
    "httpx>=0.28.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.21.0,<7.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
]

[project.scripts]
soundshelf-api = "app.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "RUF",
]
ignore = [
    # El proyecto usa camelCase de forma explicita en modulos, funciones y variables.
    "N",
    # Los nombres descriptivos de tests y algunos contratos exceden 100 caracteres.
    "E501",
    # Depends(...) es el patron declarado por FastAPI para dependencias.
    "B008",
    # Se conservan enums string compatibles con Python 3.12 y dobles de test.
    "UP042",
    "RUF012",
    "RUF001",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
addopts = "-q --basetemp=.pytestTmp"
