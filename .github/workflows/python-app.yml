name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verificar front
        run: |
          python scripts/verifyFront.py

      - name: Comprobar que el proyecto compila
        run: |
          python -m compileall app

      - name: Ejecutar tests si existen
        run: |
          if find tests -name "test*.py" | grep -q .; then
            pytest
          else
            echo "No hay tests detectados con el patron test*.py"
          fi
